<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景渐变：黑曜石深木炭微暖暗金 -->
    <linearGradient id="freeshop-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26211C" />
      <stop offset="45%" stop-color="#181512" />
      <stop offset="100%" stop-color="#0E0C0A" />
    </linearGradient>

    <!-- 微光外边框 -->
    <linearGradient id="freeshop-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#D97706" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.45" />
    </linearGradient>

    <!-- 流金琥珀主渐变 -->
    <linearGradient id="freeshop-amber-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- 香槟钛金侧立柱渐变 -->
    <linearGradient id="freeshop-gold-stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 柔和立体阴影 -->
    <filter id="freeshop-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- 黑曜石圆角基底 -->
  <rect width="512" height="512" rx="116" fill="url(#freeshop-bg)" />
  <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="url(#freeshop-border)" stroke-width="4.5" />

  <!-- 品牌图形：Monogram 'F' + 极速闪电折翼 -->
  <g filter="url(#freeshop-glow)">
    <!-- 1. F 的基柱 (Stem) -->
    <rect x="132" y="120" width="64" height="272" rx="16" fill="url(#freeshop-gold-stem)" />

    <!-- 2. F 的顶横梁 (Top Bar) -->
    <path d="M 216 120
             H 364
             C 374 120, 380 131, 373 138
             L 296 204
             C 292 208, 286 210, 280 210
             H 216
             Z"
          fill="url(#freeshop-amber-main)" />

    <!-- 3. F 的中间折翼与闪电突刺 (Lightning Bolt) -->
    <path d="M 216 230
             H 336
             C 345 230, 350 241, 344 248
             L 225 388
             C 217 397, 204 391, 209 380
             L 242 296
             H 216
             C 208 296, 202 290, 202 282
             V 244
             C 202 236, 208 230, 216 230
             Z"
          fill="url(#freeshop-amber-main)" />
  </g>
</svg>